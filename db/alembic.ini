[alembic]
script_location = db/alembic
prepend_sys_path = .
timezone = UTC
version_path_separator = os

# Fallback URL for local development. In CI/runtime, prefer:
#   ALEMBIC_DATABASE_URL or DATABASE_URL
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/zyplat

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
