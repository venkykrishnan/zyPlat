name: CI - Code Quality & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -r cli/requirements-dev.txt
      
      - name: Run Black (formatting check)
        run: |
          black --check backend/ cli/
        continue-on-error: false
      
      - name: Run Ruff (linting)
        run: |
          ruff check backend/ cli/
        continue-on-error: false
      
      - name: Run mypy (type checking)
        run: |
          mypy backend/app/ cli/zyplat_cli/
        continue-on-error: false
      
      - name: Check if all quality gates passed
        run: echo "✅ All code quality checks passed!"

  # Independent of code-quality on purpose: migration problems should surface even while lint
  # or type errors are failing. Uses its own database, separate from the test suite's schema.
  migrations:
    name: Verify Alembic Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zyplat
          POSTGRES_PASSWORD: zyplat
          POSTGRES_DB: zyplat_migrations
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify migrations from backend/
        env:
          ALEMBIC_DATABASE_URL: postgresql://zyplat:zyplat@localhost:5432/zyplat_migrations
        run: |
          cd backend
          test "$(alembic heads | grep -c '(head)')" = "1"
          alembic upgrade head
          alembic current | grep '(head)'
          alembic downgrade base
          alembic upgrade head

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: code-quality  # Only run tests if code quality passes
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zyplat
          POSTGRES_PASSWORD: zyplat
          POSTGRES_DB: zyplat_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -r cli/requirements-dev.txt
      
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://zyplat:zyplat@localhost:5432/zyplat_test
        run: |
          pytest tests/ -v --cov=backend/app --cov=cli/zyplat_cli --cov-report=xml --cov-report=term --cov-fail-under=80
        continue-on-error: false
      
      - name: Check coverage threshold
        run: |
          echo "✅ Coverage meets minimum threshold of 80%"
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # This job only runs on main branch pushes (after merge)
  deploy-gate:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: [code-quality, migrations, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deployment approved
        run: |
          echo "✅ All checks passed - deployment can proceed"
          echo "DEPLOY_APPROVED=true" >> $GITHUB_ENV
      
      - name: Notify deployment readiness
        run: |
          echo "Ready to deploy to:"
          echo "  - Render (auto-deploy enabled)"
          echo "  - AWS ECS Fargate (manual trigger or auto-deploy)"
